spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

openai-compatible:
  aliyun:
    api-key: test-key
    base-url: http://127.0.0.1:9999/v1
    model: qwen-plus
    embedding-model: text-embedding-v4
    embedding-dimensions: 1024
    temperature: 0.7
    max-tokens: 128
    timeout-seconds: 30

pinecone:
  api-key: test-key
  index: ai
  namespace: default
  enabled: false
  init-on-startup: false
