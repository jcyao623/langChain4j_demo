spring:
  application:
    name: langchain4j-demo
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
        group: DEFAULT_GROUP
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        enabled: true
  config:
    import:
      - optional:nacos:langchain4j-demo.yaml?group=DEFAULT_GROUP&refreshEnabled=true

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

openai-compatible:
  aliyun:
    api-key: ${ALIYUN_OPENAI_API_KEY:}
    base-url: https://ws-2wy7rpguu4hmc4lx.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    embedding-model: text-embedding-v4
    embedding-dimensions: 1024
    temperature: 0.7
    max-tokens: 1024
    timeout-seconds: 60

pinecone:
  api-key: ${PINECONE_API_KEY:}
  index: ai
  namespace: __default__
  enabled: true
  init-on-startup: false
  embedding-batch-size: 10
  faq-file: faq/finance-faq.txt
